<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="icon" href="./favicon.png" id="favicon">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main id="container">
        <h1>Quick Tip</h1>
        <!-- Total bill & tip -->
        <section>
            <div class="bill">
                <label for="yourBill">Bill</label>
                <input type="number" placeholder="Your bill" id="yourBill">
            </div>
            <div class="spaceBetween">
                <label for="tipInput">Select tip</label>
                <span id="tipPercent"></span>
            </div>
            <input type="range" value="0" id="tipInput" class="range">
            <div class="spaceBetween">
                <span>Tip</span>
                <span id="tipValue"></span>
            </div>
            <hr>
            <div class="spaceBetween total">
                <span>Total</span>
                <span id="totalWithTip"></span>
            </div>
        </section>

        <!-- Split bill & tip -->
        <section>
            <div>
                <div class="spaceBetween">
                    <label for="splitInput">Split</label>
                    <span id="splitValue"></span>
                </div>
                <input type="range" min="1" max="10" value="1" id="splitInput" class="range">
            </div>
            <div class="spaceBetween">
                <span>Bill each</span>
                <span id="billEach"></span>
            </div>
            <div class="spaceBetween">
                <span>Tip each</span>
                <span id="tipEach"></span>
            </div>
        </section>
    </main>
    <script>
        function formatCurrency(value) {
            value = Math.ceil(value * 100) / 100;
            value = value.toFixed(2);
            return "Rp " + value;
        }
        
        function formatSplit(value) {
            if (value == 1) return value + " person";
            return value + " people";
            
        }
        function update() {
            let bill = Number(document.getElementById("yourBill").value);
            let tipPercent = document.getElementById("tipInput").value;
            let splitValue = document.getElementById("splitInput").value;
                        
            let tipValue = bill * (tipPercent / 100);
            let totalWithTip = bill + tipValue;
            let billEach = totalWithTip / splitValue;
            let tipEach = tipValue / splitValue;
            console.log({bill, tipPercent, tipValue, splitValue, billEach, tipEach});

            document.getElementById("tipPercent").innerText = tipPercent + "%";
            document.getElementById("tipValue").innerText = formatCurrency(tipValue);
            document.getElementById("totalWithTip").innerText = formatCurrency(totalWithTip);
            document.getElementById("splitValue").innerText = formatSplit(splitValue);
            document.getElementById("billEach").innerText = formatCurrency(billEach);
            document.getElementById("tipEach").innerText = formatCurrency(tipEach);
        }
        document.getElementById("container").addEventListener("input", update);
        
    </script>
</body>
</html>
